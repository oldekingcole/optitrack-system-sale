name: Test site and backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js && node --check frontend/config.js
      - name: Confirm required site files
        run: test -f frontend/index.html && test -f frontend/styles.css && test -f frontend/assets/OptiTrack_Buyer_Brochure_Draft_v2.pdf
